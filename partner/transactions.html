<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Transaksi — Dashboard Partner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="partner.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar"></aside>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="topbar-breadcrumb">
                        Dashboard <i class="fas fa-chevron-right" style="font-size:0.6rem"></i>
                        <span>Transaksi</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-btn" title="Notifikasi"><i class="fas fa-bell"></i><span class="badge-dot"></span></button>
                </div>
            </header>

            <main class="page-content">
                <h1 class="page-title">Monitoring Transaksi</h1>
                <p class="page-subtitle">Pantau semua transaksi yang terjadi di aplikasi Anda.</p>

                <!-- Table -->
                <div class="table-container">
                    <div class="table-toolbar">
                        <div class="table-toolbar-left">
                            <div class="filter-row">
                                <input type="date" class="form-input" id="filterDateFrom" style="width:150px" onchange="applyFilters()">
                                <span style="color:var(--text-muted);font-size:0.8rem">s/d</span>
                                <input type="date" class="form-input" id="filterDateTo" style="width:150px" onchange="applyFilters()">
                                <select class="form-select" id="filterType" style="width:140px" onchange="applyFilters()">
                                    <option value="">Semua Jenis</option>
                                    <option value="transfer">Transfer</option>
                                    <option value="topup">Top Up</option>
                                    <option value="qris">QRIS</option>
                                    <option value="biller">Biller</option>
                                </select>
                                <select class="form-select" id="filterStatus" style="width:140px" onchange="applyFilters()">
                                    <option value="">Semua Status</option>
                                    <option value="Berhasil">Berhasil</option>
                                    <option value="Gagal">Gagal</option>
                                    <option value="Diproses">Diproses</option>
                                </select>
                            </div>
                        </div>
                        <div class="table-toolbar-right">
                            <button class="btn btn-outline btn-sm" onclick="exportCsv()">
                                <i class="fas fa-download"></i> Export CSV
                            </button>
                        </div>
                    </div>

                    <div style="overflow-x:auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID Transaksi</th>
                                    <th>User</th>
                                    <th>Jenis</th>
                                    <th>Nominal</th>
                                    <th>Status</th>
                                    <th>Waktu</th>
                                    <th>Detail</th>
                                </tr>
                            </thead>
                            <tbody id="trxTableBody"></tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div id="trxCount">0 transaksi</div>
                        <div class="table-pagination" id="trxPagination"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-dialog" style="max-width:520px">
            <div class="modal-header">
                <div class="modal-title">Detail Transaksi</div>
                <button class="modal-close" onclick="closeModal('detailModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <script src="../shared/data.js"></script>
    <script src="../shared/versions.js?v=2.3.0"></script>
    <script src="partner.js?v=2.3.0"></script>
    <script>
        let allTrx = [];
        let filteredTrx = [];
        const PAGE_SIZE = 10;
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            initPartner();
            renderSidebar('transaksi');
            loadTransactions();
        });

        function loadTransactions() {
            allTrx = PaydiaData.getTransactions(getTenantId());
            // Sort newest first
            allTrx.sort((a, b) => b.date.localeCompare(a.date));
            applyFilters();
        }

        function applyFilters() {
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            const type = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;

            filteredTrx = allTrx.filter(t => {
                if (dateFrom && t.date.substring(0, 10) < dateFrom) return false;
                if (dateTo && t.date.substring(0, 10) > dateTo) return false;
                if (type && t.type !== type) return false;
                if (status && t.status !== status) return false;
                return true;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = filteredTrx.slice(start, start + PAGE_SIZE);
            const tbody = document.getElementById('trxTableBody');

            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7">
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="fas fa-receipt"></i></div>
                            <div class="empty-state-title">Tidak ada transaksi</div>
                            <div class="empty-state-desc">Coba ubah filter untuk melihat data transaksi.</div>
                        </div>
                    </td></tr>
                `;
            } else {
                tbody.innerHTML = pageData.map(t => `
                    <tr>
                        <td style="font-family:monospace;font-size:0.78rem;color:var(--text-muted)">${t.id}</td>
                        <td><strong>${t.userName}</strong></td>
                        <td>${trxTypeLabel(t.type)}</td>
                        <td style="font-weight:600">${PaydiaData.formatCurrency(t.nominal)}</td>
                        <td>${statusBadge(t.status)}</td>
                        <td style="font-size:0.8rem;color:var(--text-secondary)">${t.date}</td>
                        <td>
                            <button class="btn-icon" onclick="showDetail('${t.id}')" title="Lihat detail">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('trxCount').textContent = `${filteredTrx.length} transaksi`;
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredTrx.length / PAGE_SIZE);
            const container = document.getElementById('trxPagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        function goPage(p) {
            const totalPages = Math.ceil(filteredTrx.length / PAGE_SIZE);
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            renderTable();
        }

        function showDetail(id) {
            const t = allTrx.find(tx => tx.id === id);
            if (!t) return;

            document.getElementById('detailModalBody').innerHTML = `
                <dl class="detail-grid">
                    <dt>ID Transaksi</dt><dd style="font-family:monospace">${t.id}</dd>
                    <dt>No. Referensi</dt><dd style="font-family:monospace">${t.refNo}</dd>
                    <dt>User</dt><dd>${t.userName} (${t.userId})</dd>
                    <dt>Jenis</dt><dd>${trxTypeLabel(t.type)}</dd>
                    <dt>Nominal</dt><dd style="font-weight:700;font-size:1rem">${PaydiaData.formatCurrency(t.nominal)}</dd>
                    <dt>Biaya</dt><dd>${PaydiaData.formatCurrency(t.fee)}</dd>
                    <dt>Total</dt><dd style="font-weight:700">${PaydiaData.formatCurrency(t.nominal + t.fee)}</dd>
                    <dt>Status</dt><dd>${statusBadge(t.status)}</dd>
                    <dt>Penerima</dt><dd>${t.recipientName}</dd>
                    <dt>No. HP Penerima</dt><dd>${t.recipientPhone}</dd>
                    <dt>Waktu</dt><dd>${t.date}</dd>
                </dl>
            `;
            openModal('detailModal');
        }

        function exportCsv() {
            if (filteredTrx.length === 0) {
                showToast('Informasi', 'Tidak ada data untuk diexport.', 'warning');
                return;
            }

            const headers = ['ID', 'User', 'Jenis', 'Nominal', 'Biaya', 'Status', 'Penerima', 'No Referensi', 'Waktu'];
            const rows = filteredTrx.map(t => [
                t.id, t.userName, trxTypeLabel(t.type), t.nominal, t.fee, t.status, t.recipientName, t.refNo, t.date
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(r => {
                csv += r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transaksi_${getTenantId()}_${new Date().toISOString().substring(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Berhasil', `${filteredTrx.length} transaksi berhasil diexport.`, 'success');
        }
    </script>
    <!-- Watermark -->
    <div style="position: fixed; bottom: 8px; right: 8px; font-size: 0.9rem; color: #000000; text-align: right; pointer-events: none; z-index: 99999; line-height: 1.2; font-family: 'Inter', sans-serif;">
        Mockup Prototype - Final Display May Different<br>
        Confidential | Do Not Share Without Permission
    </div>
</body>
</html>
