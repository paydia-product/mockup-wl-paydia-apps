<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction — Dashboard Partner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../shared/shared.css">
    <link rel="stylesheet" href="partner.css?v=2.6.0">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="pbSidebar"></aside>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="topbar-breadcrumb">
                        Dashboard <i class="fas fa-chevron-right" style="font-size:0.6rem"></i>
                        <span>Transaction</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-btn" title="Notifikasi"><i class="fas fa-bell"></i><span class="badge-dot"></span></button>
                </div>
            </header>

            <main class="page-content">
                <h1 class="page-title">Transaction</h1>
                <p class="page-subtitle">Transaksi yang terjadi pada aplikasi whitelabel partner ini.</p>

                <!-- Table -->
                <div class="table-container table-light">
                    <div class="table-toolbar">
                        <div class="table-toolbar-left">
                            <div class="table-search">
                                <button><i class="fas fa-search"></i></button>
                                <input type="text" id="searchInput" placeholder="Cari ID transaksi atau nama user..." oninput="applyFilters()">
                            </div>
                            <select class="form-select" id="filterType" style="width:140px;padding:8px 12px;font-size:0.8rem" onchange="applyFilters()">
                                <option value="">Semua Jenis</option>
                            </select>
                            <select class="form-select" id="filterStatus" style="width:140px;padding:8px 12px;font-size:0.8rem" onchange="applyFilters()">
                                <option value="">Semua Status</option>
                            </select>
                        </div>
                        <div class="table-toolbar-right">
                            <span style="font-size:0.8rem;color:var(--text-muted)" id="trxCountLabel">0 transaksi</span>
                        </div>
                    </div>

                    <div style="overflow-x:auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID Transaksi</th>
                                    <th>Nama User</th>
                                    <th>Jenis</th>
                                    <th>Nominal</th>
                                    <th>Status</th>
                                    <th>Tanggal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="trxTableBody"></tbody>
                        </table>
                    </div>

                    <div class="table-footer">
                        <div id="trxPageInfo">-</div>
                        <div class="table-pagination" id="trxPagination"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-dialog modal-light" style="max-width:520px">
            <div class="modal-header">
                <div class="modal-title">Detail Transaksi</div>
                <button class="modal-close" onclick="closeModal('detailModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
        </div>
    </div>

    <script src="../shared/data.js"></script>
    <script src="../shared/versions.js?v=2.6.0"></script>
    <script src="partner.js?v=2.6.0"></script>
    <script>
        let allTrx = [];
        let filteredTrx = [];
        const PAGE_SIZE = 10;
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            initPartner();
            renderSidebar('app-transactions');
            loadTransactions();
        });

        function loadTransactions() {
            allTrx = PaydiaData.getTransactions(getTenantId());
            allTrx.sort((a, b) => b.date.localeCompare(a.date));
            populateFilters();
            applyFilters();
        }

        function populateFilters() {
            const typeSelect = document.getElementById('filterType');
            const distinctTypes = [...new Set(allTrx.map(t => t.type))];
            typeSelect.innerHTML = '<option value="">Semua Jenis</option>' +
                distinctTypes.map(t => `<option value="${t}">${trxTypeLabel(t)}</option>`).join('');

            const statusSelect = document.getElementById('filterStatus');
            const distinctStatuses = [...new Set(allTrx.map(t => t.status))];
            statusSelect.innerHTML = '<option value="">Semua Status</option>' +
                distinctStatuses.map(s => `<option value="${s}">${statusLabel(s)}</option>`).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const status = document.getElementById('filterStatus').value;

            filteredTrx = allTrx.filter(t => {
                if (search &&
                    !t.id.toLowerCase().includes(search) &&
                    !t.userName.toLowerCase().includes(search)) return false;
                if (type && t.type !== type) return false;
                if (status && t.status !== status) return false;
                return true;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = filteredTrx.slice(start, start + PAGE_SIZE);
            const tbody = document.getElementById('trxTableBody');

            if (pageData.length === 0) {
                const noData = allTrx.length === 0;
                tbody.innerHTML = `
                    <tr><td colspan="7">
                        <div class="empty-state">
                            <div class="empty-state-icon"><i class="fas fa-receipt"></i></div>
                            <div class="empty-state-title">${noData ? 'Belum ada transaksi' : 'Tidak ada hasil'}</div>
                            <div class="empty-state-desc">${noData ? 'Belum ada transaksi yang tercatat di aplikasi ini.' : 'Tidak ada transaksi yang cocok dengan pencarian atau filter.'}</div>
                        </div>
                    </td></tr>
                `;
            } else {
                tbody.innerHTML = pageData.map(t => `
                    <tr>
                        <td style="font-family:monospace;font-size:0.78rem;color:var(--text-muted)">${t.id}</td>
                        <td><strong>${t.userName}</strong></td>
                        <td>${trxTypeLabel(t.type)}</td>
                        <td style="font-weight:600">${PaydiaData.formatCurrency(t.nominal)}</td>
                        <td>${statusBadge(t.status)}</td>
                        <td style="font-size:0.8rem;color:var(--text-secondary)">${t.date}</td>
                        <td>
                            <button class="btn-icon" onclick="showDetail('${t.id}')" title="Lihat detail">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('trxCountLabel').textContent = `${filteredTrx.length} transaksi`;
            const totalPages = Math.ceil(filteredTrx.length / PAGE_SIZE);
            document.getElementById('trxPageInfo').textContent = totalPages > 0 ? `Hal. ${currentPage} dari ${totalPages}` : '-';
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredTrx.length / PAGE_SIZE);
            const container = document.getElementById('trxPagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        function goPage(p) {
            const totalPages = Math.ceil(filteredTrx.length / PAGE_SIZE);
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            renderTable();
        }

        function showDetail(id) {
            const t = allTrx.find(tx => tx.id === id);
            if (!t) return;

            document.getElementById('detailModalBody').innerHTML = `
                <dl class="detail-grid">
                    <dt>ID Transaksi</dt><dd style="font-family:monospace">${t.id}</dd>
                    <dt>No. Referensi</dt><dd style="font-family:monospace">${t.refNo}</dd>
                    <dt>User</dt><dd>${t.userName} (${t.userId})</dd>
                    <dt>Jenis</dt><dd>${trxTypeLabel(t.type)}</dd>
                    <dt>Nominal</dt><dd style="font-weight:700;font-size:1rem">${PaydiaData.formatCurrency(t.nominal)}</dd>
                    <dt>Biaya</dt><dd>${PaydiaData.formatCurrency(t.fee)}</dd>
                    <dt>Total</dt><dd style="font-weight:700">${PaydiaData.formatCurrency(t.nominal + t.fee)}</dd>
                    <dt>Status</dt><dd>${statusBadge(t.status)}</dd>
                    <dt>Penerima</dt><dd>${t.recipientName || '-'}</dd>
                    <dt>No. HP Penerima</dt><dd>${t.recipientPhone || '-'}</dd>
                    <dt>Tanggal</dt><dd>${t.date}</dd>
                </dl>
            `;
            openModal('detailModal');
        }
    </script>
    <!-- Watermark -->
    <div style="position: fixed; bottom: 8px; right: 8px; font-size: 0.9rem; color: #000000; text-align: right; pointer-events: none; z-index: 99999; line-height: 1.2; font-family: 'Inter', sans-serif;">
        Mockup Prototype - Final Display May Different<br>
        Confidential | Do Not Share Without Permission
    </div>
</body>
</html>
