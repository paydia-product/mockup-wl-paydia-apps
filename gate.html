<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Paydia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 50%, #FFFFFF 100%);
            padding: 20px;
            overflow: hidden;
        }

        .gate-container {
            width: 100%;
            max-width: 360px;
            perspective: 1000px;
        }

        .gate-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(30, 64, 175, 0.15);
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(30, 64, 175, 0.15);
            border-radius: 12px;
            padding: 14px 44px 14px 16px;
            color: #1E293B;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            text-align: center;
        }

        .form-input:focus {
            outline: none;
            border-color: #3B82F6;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-input.error {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #64748B;
        }

        .btn-unlock {
            width: 100%;
            background: linear-gradient(135deg, #1E40AF, #3B82F6);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.2);
        }

        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(30, 64, 175, 0.3);
            filter: brightness(1.05);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .btn-unlock:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-unlock .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-unlock.loading .btn-text { display: none; }
        .btn-unlock.loading .spinner { display: inline-block; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 12px;
            color: #EF4444;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .error-message.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Shake animation for incorrect password */
        .shake {
            animation: shake 0.5s linear;
        }

        @keyframes shake {
            8%, 41% { transform: translateX(-10px); }
            25%, 58% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            92% { transform: translateX(5px); }
            0%, 100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="gate-container">
        <div class="gate-card" id="gateCard">
            <form id="gateForm" autocomplete="off">
                <div class="error-message" id="errorMsg">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            required
                            autofocus
                        >
                        <button type="button" class="toggle-password" id="togglePw" aria-label="Toggle password">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-unlock" id="btnUnlock">
                    <span class="btn-text"><i class="fas fa-unlock"></i></span>
                    <span class="spinner"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('gateForm');
        const pwInput = document.getElementById('password');
        const btn = document.getElementById('btnUnlock');
        const card = document.getElementById('gateCard');
        const togglePw = document.getElementById('togglePw');
        const eyeIcon = document.getElementById('eyeIcon');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        // Toggle password visibility
        togglePw.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = pwInput.value;

            if (!pw) {
                showError('!');
                return;
            }

            // Show loading
            btn.classList.add('loading');
            btn.disabled = true;
            clearError();

            // Simulate small delay
            await new Promise(r => setTimeout(r, 500));

            try {
                const response = await fetch('/api/unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });

                if (response.ok) {
                    // Extract next/redirect param from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    let next = urlParams.get('next') || '/login.html';
                    // FIX: Validate redirect target — only allow relative paths
                    // Prevents open redirect attacks (e.g. ?next=https://evil.com)
                    if (!next.startsWith('/') || next.startsWith('//')) {
                        next = '/login.html';
                    }
                    window.location.replace(next);
                } else {
                    const data = await response.json();
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    showError(data.message || 'X');
                    pwInput.select();
                }
            } catch (err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                showError('Err');
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('show');
            pwInput.classList.add('error');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 500);
        }

        function clearError() {
            errorMsg.classList.remove('show');
            pwInput.classList.remove('error');
        }

        pwInput.addEventListener('input', clearError);

        // Explicitly forward Enter to a real form submission.
        // Root cause: the implicit-submit mechanism (Enter inside a lone
        // text field with a submit button) is silently swallowed in some
        // browser/autofill combinations once the field's value was set
        // programmatically (e.g. by a password manager) rather than via
        // real keystrokes — no native "submit" event is ever dispatched.
        // requestSubmit() re-triggers the browser's own validation +
        // submit pipeline (same as a real click), so this isn't a
        // parallel/duplicate submit path — it's the same one, made
        // reliable regardless of how the value got into the field.
        pwInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
    <!-- Watermark -->
    <div style="position: fixed; bottom: 8px; right: 8px; font-size: 0.9rem; color: #000000; text-align: right; pointer-events: none; z-index: 99999; line-height: 1.2; font-family: 'Inter', sans-serif;">
        Mockup Prototype - Final Display May Different<br>
        Confidential | Do Not Share Without Permission
    </div>
</body>
</html>
